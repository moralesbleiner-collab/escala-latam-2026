<style>
/* Layout: historias verticales 9:16 al estilo "Wrapped", cada tarjeta diseñada a 1080×1920 y escalada al visor; vista de galería con todas las tarjetas. Tema único noche + oro de Escala LATAM. */
:root{
  color-scheme:dark;
  --bg:#050506; --panel:#0e0d0f; --line:#2b2721; --ink:#f4efe6; --ink-2:#b9b0a0; --ink-3:#7f776a;
  --gold:#e9c587; --gold-2:#c99a56; --gold-3:#f7e2b8; --bronze:#a8773a;
  --grad:linear-gradient(180deg,#fbe8c2 0%,#e9c587 45%,#c4924c 100%);
  --display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.app{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(233,197,135,.09),transparent 70%)}
.top{width:100%;max-width:1180px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.14em;color:var(--gold-3)}
.brand span{color:var(--ink-3)}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--grad);color:#1a1209}

/* Player */
.stage-row{display:flex;align-items:center;gap:18px;max-width:100%}
.player{position:relative;width:min(calc(100vw - 32px),calc((100vh - 140px) * 0.5625),500px);aspect-ratio:9/16;max-width:100%;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 30px 90px -30px rgba(233,197,135,.25),0 0 0 1px var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.frame{position:relative;overflow:hidden}
.player .slide{visibility:hidden}
.player .slide.cur{visibility:visible}
.bars{position:absolute;left:14px;right:14px;top:12px;display:flex;gap:5px;z-index:5;pointer-events:none}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden;display:block}
.bars b{display:block;height:100%;width:0;background:#fff}
.tap{position:absolute;inset:0;z-index:4;cursor:pointer}
.paused-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;letter-spacing:.08em;pointer-events:none}
.arrow{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--gold-3);flex:none}
.arrow:hover{border-color:var(--gold-2)}
.arrow:disabled{opacity:.3;cursor:default}
.arrow svg{width:20px;height:20px}
.hint{font-size:12px;color:var(--ink-3);text-align:center}
.controls{display:flex;gap:10px;align-items:center}
.ctl{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.ctl svg{width:14px;height:14px}

/* Gallery */
.gallery{width:100%;max-width:1180px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.thumb{border:0;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left}
.thumb .frame{width:100%;aspect-ratio:9/16;border-radius:14px;box-shadow:0 0 0 1px var(--line);transition:transform .2s,box-shadow .2s}
.thumb:hover .frame{transform:translateY(-4px);box-shadow:0 0 0 1px var(--gold-2),0 20px 40px -20px rgba(233,197,135,.4)}
.thumb span{font-size:12px;color:var(--ink-2);font-weight:600;letter-spacing:.04em}
.thumb span b{color:var(--gold);font-family:var(--display);font-size:16px;font-weight:400;margin-right:6px;letter-spacing:.06em}

@media (max-width:640px){.arrow{display:none}.stage-row{gap:0}}

/* ===== Slides: diseñadas a 1080×1920 ===== */
.slide{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;transform:scale(var(--k,1));overflow:hidden;background:#060607;color:var(--ink);font-family:var(--body)}
.slide canvas.bgc{position:absolute;inset:0;width:1080px;height:1920px}
.pad{position:absolute;inset:0;padding:150px 96px 100px;display:flex;flex-direction:column}
.s-brand{font-family:var(--display);font-size:34px;letter-spacing:.22em;color:var(--gold-3);opacity:.85}
.s-foot{margin-top:auto;padding-top:28px;display:flex;justify-content:space-between;font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.lab{font-size:34px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-3);margin-top:80px}
.gold{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.huge{font-family:var(--display);font-size:380px;line-height:.86;letter-spacing:-.005em;margin-top:24px}
.lead{font-size:50px;line-height:1.22;font-weight:600;max-width:860px;margin:30px 0 0;text-wrap:balance}
.lead em{font-style:normal;color:var(--gold)}
.small{font-size:30px;color:var(--ink-2);line-height:1.35;margin:0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;border-top:2px solid var(--line);padding-top:36px}
.duo{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;border-top:2px solid var(--line);padding-top:36px}
.stat .v{font-family:var(--display);font-size:150px;line-height:.9}
.stat .k{font-size:27px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:12px;align-items:center;margin-top:6px}
.dot{width:20px;height:20px;border-radius:50%;flex:none;display:inline-block}

/* inverted gold slide */
.slide.inv{background:linear-gradient(170deg,#f6dfae 0%,#e8c182 55%,#c99550 100%);color:#140e06}
.slide.inv .s-brand,.slide.inv .lab{color:#3b2a12}
.slide.inv .s-foot{color:#5b4320}
.slide.inv .lead em{color:#140e06;text-decoration:underline;text-decoration-thickness:5px;text-underline-offset:10px}

.cover-k{font-size:32px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-3);margin-top:80px}
.cover-t{font-family:var(--display);font-size:205px;line-height:.88;margin-top:30px}
.cover-n{font-family:var(--display);font-size:128px;letter-spacing:.16em;color:var(--gold-3);margin-top:14px}
.cover-p{font-size:40px;line-height:1.3;color:var(--ink-2);max-width:760px;margin:40px 0 0}

/* entrance animation (player only) */
.player .slide.cur.play .rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
.player .slide.cur.play .grow{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 120ms);transform-origin:left center}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.player .slide.cur.play .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i,0) * 22ms + 300ms)}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <div class="top">
    <div class="brand">Escala LATAM Summit 2026 <span>· en números</span></div>
    <div class="seg" role="group" aria-label="Vista">
      <button type="button" id="v-story" aria-pressed="true">Historia</button>
      <button type="button" id="v-grid" aria-pressed="false">Todas las tarjetas</button>
    </div>
  </div>

  <div id="story" style="display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%">
    <div class="stage-row">
      <button class="arrow" id="prev" type="button" aria-label="Tarjeta anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="player frame" id="player" aria-roledescription="historia" aria-live="polite">
        <div class="bars" id="bars"></div>
        <div id="slides"></div>
        <div class="tap" id="tap" aria-hidden="true"></div>
        <div class="paused-badge" id="paused" hidden>EN PAUSA</div>
      </div>
      <button class="arrow" id="next" type="button" aria-label="Tarjeta siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="controls">
      <button class="ctl" id="pp" type="button"></button>
      <button class="ctl" id="restart" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Volver a empezar</button>
    </div>
    <p class="hint">Toca a la derecha para avanzar, a la izquierda para volver. Mantén presionado para pausar.</p>
  </div>

  <div class="gallery" id="gallery" hidden></div>
</div>

<script>
const H = {"15": [0, 2, 123, 286, 209, 57, 23, 127, 251, 208, 73, 55, 10, 1], "16": [1, 4, 158, 184, 155, 122, 17, 80, 151, 166, 119, 32, 1, 0]};
const D = {
  pres:2848, d1:1583, d2:1265,
  part:2643,
  esc:{pan:37, con:4, mod:3},
  inv:{esp:82, asa:39},
  staff:35, prensa:5,
  virt:{part:141, conn:402, d1:87, d2:54, salas:[['Sala principal',93],['Sala silenciosa',31],['Flow',17]]}
};
const fmt = n => new Intl.NumberFormat('es-CO').format(n);
const FOOT = `<div class="s-foot"><span>15 · 16 oct 2026</span><span>#EscalaLATAM</span></div>`;
const BRAND = `<div class="s-brand">Escala LATAM Summit 2026</div>`;
const person = (x,y,s,c,i) => `<g transform="translate(${x} ${y}) scale(${s})"><g class="pop" style="--i:${i};transform-box:fill-box;transform-origin:center"><circle cx="0" cy="0" r="15" fill="${c}"/><path d="M-27 54Q-27 23 0 23Q27 23 27 54Z" fill="${c}"/></g></g>`;

const SLIDES = [
 {name:'Portada', cls:'', html:()=>`<canvas class="bgc" data-sky="0.74"></canvas><div class="pad">
    <div class="cover-k rise" style="--d:0">15 y 16 de octubre de 2026</div>
    <div class="cover-t gold rise" style="--d:1">Escala LATAM<br>Summit 2026</div>
    <div class="cover-n rise" style="--d:2">En números</div>
    <p class="cover-p rise" style="--d:3">Dos días de congreso, contados en cifras.</p>
  </div>`},

 {name:'Asistencias', cls:'', html:()=>`<div class="pad">${BRAND}
    <div class="lab rise" style="--d:0">Asistencias presenciales</div>
    <div class="huge gold rise" style="--d:1"><span data-count="2800" data-pre="+">+2.800</span></div>
    <p class="lead rise" style="--d:2"><em>${fmt(D.pres)}</em> asistencias en dos días de congreso. Cada punto es una.</p>

 {name:'Participantes', cls:'inv', html:()=>{

 {name:'Detrás del evento', cls:'', html:()=>{

 {name:'Virtual', cls:'', html:()=>{

 {name:'Hora pico', cls:'', html:()=>{
    const a=H['15'], b=H['16'], W=888, Hh=560, n=a.length, max=300;
    const x=i=>i/(n-1)*W, y=v=>40+(1-v/max)*(Hh-110);
    const p=arr=>arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
    const pk=a.indexOf(Math.max(...a));
    let xl=''; [0,3,6,9,12].forEach(i=>{const h=6+i; xl+=`<text x="${x(i)}" y="${Hh-14}" fill="#7f776a" font-size="28" font-family="Inter,sans-serif" text-anchor="${i===0?'start':i===12?'end':'middle'}">${h>12?h-12:h} ${h>=12?'p.m.':'a.m.'}</text>`;});

    <svg class="rise" style="--d:3;margin-top:90px;overflow:visible" width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" aria-hidden="true">
      <defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c587" stop-opacity=".55"/><stop offset="1" stop-color="#e9c587" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#2b2721" stroke-width="2"/>
      <path d="${p(a)} L${W} ${y(0)} L0 ${y(0)} Z" fill="url(#ar)"/>
      <path d="${p(b)}" fill="none" stroke="#a8a094" stroke-width="5" stroke-dasharray="14 10" stroke-linejoin="round"/>
      <path d="${p(a)}" fill="none" stroke="#f3d59c" stroke-width="7" stroke-linejoin="round"/>
      <line x1="${x(pk)}" x2="${x(pk)}" y1="${y(a[pk])}" y2="${y(0)}" stroke="#f7e2b8" stroke-width="2" stroke-dasharray="6 8"/>
      <circle cx="${x(pk)}" cy="${y(a[pk])}" r="18" fill="#fbe8c2" stroke="#060607" stroke-width="6"/>
      ${xl}

      <span class="small" style="display:flex;gap:16px;align-items:center;color:var(--ink)"><svg width="54" height="10"><line x1="0" x2="54" y1="5" y2="5" stroke="#a8a094" stroke-width="5" stroke-dasharray="14 10"/></svg>Día 2 · 16 oct</span>

 {name:'Gracias', cls:'', html:()=>`<canvas class="bgc" data-sky="0.7"></canvas><div class="pad" style="text-align:center;align-items:center">

    <div class="cover-t gold rise" style="--d:1;margin-top:110px;font-size:230px">Gracias por<br>ser parte</div>
    <p class="cover-p rise" style="--d:2;margin-top:44px">${fmt(D.pres)} asistencias, ${D.esc.pan+D.esc.con+D.esc.mod} voces en el escenario y ${D.virt.part} personas conectadas en vivo.</p>
    <div class="s-foot" style="width:100%"><span>15 · 16 oct 2026</span><span>#EscalaLATAM</span></div>
  </div>`},
];

// ---- canvas drawing ----
function drawSky(cv, hf){
  const ctx=cv.getContext('2d'), W=1080, Hh=1920; cv.width=W; cv.height=Hh;
  let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,Hh);
  const R=1500, cx=W/2, hz=Hh*hf, cy=hz+R;
  for(let i=0;i<900;i++){const x=rnd()*W,y=rnd()*hz,s=rnd(); ctx.fillStyle=`rgba(255,240,215,${.12+s*.6})`; const z=s>.95?2.6:1.4; ctx.fillRect(x,y,z,z);}
  let g=ctx.createRadialGradient(cx,hz+10,0,cx,hz+10,780); g.addColorStop(0,'rgba(255,226,170,.6)'); g.addColorStop(.25,'rgba(225,160,80,.24)'); g.addColorStop(.6,'rgba(120,70,20,.07)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,Hh);
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  let pg=ctx.createLinearGradient(0,hz,0,Hh); pg.addColorStop(0,'#17120c'); pg.addColorStop(.2,'#08070a'); pg.addColorStop(1,'#030304'); ctx.fillStyle=pg; ctx.fill(); ctx.clip();
  for(let i=0;i<2600;i++){const a=-Math.PI/2+(rnd()-.5)*1.0, d=R-rnd()*rnd()*(Hh-hz)*1.3; const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d; if(y<hz||y>Hh) continue;
    const cl=Math.sin(x*.012)*Math.cos(x*.029+1.3)+Math.sin(y*.02); if(cl<.25&&rnd()>.15) continue;
    ctx.fillStyle=`rgba(255,${190+rnd()*40|0},${110+rnd()*60|0},${.2+rnd()*.6})`; const s=rnd()*2.4+.6; ctx.fillRect(x,y,s,s);}
  let sh=ctx.createLinearGradient(0,hz,0,Hh); sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(6,6,7,.92)'); ctx.fillStyle=sh; ctx.fillRect(0,hz,W,Hh-hz);
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,Math.PI*1.2,Math.PI*1.8);
  ctx.shadowColor='rgba(255,215,150,.95)'; ctx.shadowBlur=34; ctx.strokeStyle='rgba(255,236,200,.95)'; ctx.lineWidth=2.4; ctx.stroke();
  ctx.shadowBlur=80; ctx.strokeStyle='rgba(240,190,110,.55)'; ctx.lineWidth=5; ctx.stroke(); ctx.restore();
  let f=ctx.createRadialGradient(cx,hz,0,cx,hz,260); f.addColorStop(0,'rgba(255,245,220,.8)'); f.addColorStop(.3,'rgba(255,215,150,.26)'); f.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=f; ctx.fillRect(0,0,W,Hh);
}
function drawDots(cv, prog=1){
  const ctx=cv.getContext('2d'), W=888, Hh=644, s=14, cols=63, r=4.9; ctx.clearRect(0,0,W,Hh);
  const n=Math.round(D.pres*prog);
  for(let i=0;i<n;i++){const c=i%cols, rr=Math.floor(i/cols); ctx.fillStyle=i<D.d1?'#e9c587':'#7a6645'; ctx.beginPath(); ctx.arc(c*s+s/2+1, rr*s+s/2, r, 0, Math.PI*2); ctx.fill();}
}
function paint(el, animate){
  el.querySelectorAll('canvas[data-sky]').forEach(c=>{ if(!c.dataset.done){drawSky(c,+c.dataset.sky); c.dataset.done=1;} });
  el.querySelectorAll('canvas[data-dots]').forEach(c=>{
    if(!animate || matchMedia('(prefers-reduced-motion: reduce)').matches){drawDots(c,1);return;}
    const t0=performance.now(); const run=()=>{const t=performance.now();const p=Math.min(1,(t-t0-350)/1400); drawDots(c,Math.max(0,p)); if(p<1&&el.classList.contains('cur')) requestAnimationFrame(run); else drawDots(c,1);}; requestAnimationFrame(run);
  });
  if(animate && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.querySelectorAll('[data-count]').forEach(s=>{const v=+s.dataset.count, pre=s.dataset.pre||'', t0=performance.now();
      const run=()=>{const t=performance.now();const p=Math.min(1,(t-t0-150)/1100), e=1-Math.pow(1-Math.max(0,p),3); s.textContent=pre+fmt(Math.round(v*e)); if(p<1) requestAnimationFrame(run);}; requestAnimationFrame(run);});
  }
}
const mk = (s,i) => `<section class="slide ${s.cls}" data-i="${i}" aria-label="${s.name}">${s.html()}</section>`;

// ---- scaling ----
const ro=new ResizeObserver(es=>es.forEach(e=>e.target.style.setProperty('--k', e.contentRect.width/1080)));

// ---- player ----
const slidesEl=document.getElementById('slides'), barsEl=document.getElementById('bars'), player=document.getElementById('player');
slidesEl.innerHTML=SLIDES.map(mk).join('');
barsEl.innerHTML=SLIDES.map(()=>'<i><b></b></i>').join('');
ro.observe(player);
const els=[...slidesEl.children], fills=[...barsEl.querySelectorAll('b')];
const DUR=7000; let idx=0, t0=0, elapsed=0, paused=false, raf=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function show(i, animate=true){
  idx=Math.max(0,Math.min(SLIDES.length-1,i));
  els.forEach((e,j)=>{e.classList.toggle('cur',j===idx); e.classList.remove('play');});
  const el=els[idx]; void el.offsetWidth; if(animate) el.classList.add('play');
  paint(el, animate);
  fills.forEach((f,j)=>f.style.width=j<idx?'100%':'0');
  elapsed=0; t0=performance.now();
  document.getElementById('prev').disabled=idx===0; document.getElementById('next').disabled=idx===SLIDES.length-1;
  try{ history.replaceState(null,'','#t'+(idx+1)); }catch(_){}
}
function tick(){const t=performance.now();
  if(!paused){ elapsed=t-t0; const p=Math.min(1,elapsed/DUR); fills[idx].style.width=(p*100)+'%';
    if(p>=1){ if(idx<SLIDES.length-1) show(idx+1); else { setPaused(true); } } }
  raf=requestAnimationFrame(tick);
}
function setPaused(v){
  if(v===paused) return; paused=v;
  if(!v) t0=performance.now()-elapsed;
  document.getElementById('pp').innerHTML = paused ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>Reproducir' : '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>Pausar';
  document.getElementById('paused').hidden = !paused || (idx===SLIDES.length-1 && elapsed>=DUR);
}
const go=d=>{ show(idx+d); };
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.getElementById('pp').onclick=()=>{ if(paused && idx===SLIDES.length-1 && elapsed>=DUR){show(0);} setPaused(!paused); };
document.getElementById('restart').onclick=()=>{ show(0); setPaused(false); };
const tap=document.getElementById('tap'); let down=0, holdTimer=0, held=false;
tap.addEventListener('pointerdown',e=>{ down=performance.now(); held=false; holdTimer=setTimeout(()=>{held=true; setPaused(true);},260); });
tap.addEventListener('pointerup',e=>{ clearTimeout(holdTimer);
  if(held){ setPaused(false); return; }
  const r=player.getBoundingClientRect(); go((e.clientX-r.left)<r.width*0.33?-1:1); });
tap.addEventListener('pointerleave',()=>{ clearTimeout(holdTimer); if(held){held=false; setPaused(false);} });
document.addEventListener('keydown',e=>{ if(document.getElementById('story').hidden) return;
  if(e.key==='ArrowRight') go(1); else if(e.key==='ArrowLeft') go(-1); else if(e.key===' '){ e.preventDefault(); setPaused(!paused);} });

// ---- gallery ----
const gal=document.getElementById('gallery');
gal.innerHTML=SLIDES.map((s,i)=>`<button class="thumb" type="button" data-i="${i}"><div class="frame">${mk(s,i)}</div><span><b>${String(i+1).padStart(2,'0')}</b>${s.name}</span></button>`).join('');
gal.querySelectorAll('.frame').forEach(f=>{ ro.observe(f); });
let galPainted=false;
function view(v){
  const st=v==='story'; document.getElementById('story').hidden=!st; document.getElementById('story').style.display=st?'flex':'none'; gal.hidden=st;
  document.getElementById('v-story').setAttribute('aria-pressed',st); document.getElementById('v-grid').setAttribute('aria-pressed',!st);
  if(!st){ setPaused(true); if(!galPainted){ gal.querySelectorAll('.slide').forEach(s=>paint(s,false)); galPainted=true; } }
}
document.getElementById('v-story').onclick=()=>{ view('story'); setPaused(false); };
document.getElementById('v-grid').onclick=()=>view('grid');
gal.addEventListener('click',e=>{ const b=e.target.closest('.thumb'); if(!b) return; view('story'); show(+b.dataset.i); setPaused(false); });

// ---- export helper (render one card at 1080×1920) ----
window.__exportCard=i=>{ document.querySelector('.app').style.display='none'; const w=document.createElement('div'); w.style.cssText='position:fixed;left:0;top:0;width:1080px;height:1920px;z-index:99'; w.innerHTML=mk(SLIDES[i],i); document.body.appendChild(w); const s=w.firstElementChild; s.style.setProperty('--k',1); paint(s,false); return w; };

// ---- start ----
const m=/^#t(\d+)$/.exec(location.hash); const start=m? Math.min(SLIDES.length,Math.max(1,+m[1]))-1 : 0;
paused=true; setPaused(false); show(start, !reduced); raf=requestAnimationFrame(tick);
</script>
</body></html>
